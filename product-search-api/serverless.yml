service: product-search-service

frameworkVersion: '3'

# Load variables from local .env / .env.* files so ${env:...} works in all commands
useDotenv: true

provider:
  name: aws
  runtime: python3.11
  architecture: x86_64
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  memorySize: 512  # Lightweight - Bedrock embeddings via API
  timeout: 30
  
  httpApi:
    cors:
      allowedOrigins:
        - "http://localhost:3000"
        - "http://localhost:3001"
        - "${self:custom.productionFrontendUrl}"
      allowedHeaders:
        - Content-Type
        - Authorization
        - X-Requested-With
        - X-Amz-Date
        - X-Api-Key
        - X-Amz-Security-Token
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowCredentials: true  # Required for Cognito tokens
      maxAge: 3600
    # JWT Authorizer (built-in, simpler than Lambda authorizer)
    authorizers:
      cognitoAuthorizer:
        identitySource: $request.header.Authorization
        issuerUrl: https://cognito-idp.${self:provider.region}.amazonaws.com/${env:COGNITO_USER_POOL_ID}
        audience:
          - ${env:COGNITO_APP_CLIENT_ID}
  
  environment:
    # Ensure local/offline Python can locate service packages
    PYTHONPATH: ${env:PYTHONPATH, './'}
    # Qdrant Cloud Configuration
    QDRANT_URL: ${env:QDRANT_URL}
    QDRANT_API_KEY: ${env:QDRANT_API_KEY}
    QDRANT_COLLECTION: products
    
    # Embedding Model Configuration (AWS Bedrock - NO Docker needed!)
    EMBEDDING_MODEL: amazon.titan-embed-text-v1
    VECTOR_SIZE: 1536
    
    # Optional: OpenAI API Key for re-ranking
    OPENAI_API_KEY: ${env:OPENAI_API_KEY}
    
    # Parallel processing configuration
    PARALLEL_WORKER_CHUNKS: ${env:PARALLEL_WORKER_CHUNKS, '10'}
    BATCH_CHUNK_SIZE: ${env:BATCH_CHUNK_SIZE, '20'}
    MAX_SEARCH_WORKERS: ${env:MAX_SEARCH_WORKERS, '25'}
    SEARCH_RESULT_SIZE: ${env:SEARCH_RESULT_SIZE, '10'}
    
    # DynamoDB Configuration
    PRODUCT_TABLE: ${self:custom.productsTable}
    CATALOG_PRODUCTS_TABLE: ${self:custom.catalogProductsTable}
    PRICE_LIST_PRODUCTS_TABLE: ${self:custom.priceListProductsTable}
    BATCH_SEARCH_JOBS_TABLE: ${self:custom.batchSearchJobsTable}
    
    # OpenAI Rate Limiting Configuration
    OPENAI_MAX_RETRIES: ${env:OPENAI_MAX_RETRIES, '5'}
    OPENAI_RETRY_BASE_DELAY: ${env:OPENAI_RETRY_BASE_DELAY, '1.0'}
    OPENAI_BATCH_RERANK_SIZE: ${env:OPENAI_BATCH_RERANK_SIZE, '20'}
    
    # Logging
    LOG_LEVEL: INFO
    
    # Relevance Level Thresholds (configurable)
    RELEVANCE_HIGH_THRESHOLD: ${env:RELEVANCE_HIGH_THRESHOLD, '0.70'}
    RELEVANCE_MEDIUM_THRESHOLD: ${env:RELEVANCE_MEDIUM_THRESHOLD, '0.50'}
    
    # Cognito Configuration (optional - for JWT authorizer)
    COGNITO_USER_POOL_ID: ${env:COGNITO_USER_POOL_ID, ''}
    COGNITO_APP_CLIENT_ID: ${env:COGNITO_APP_CLIENT_ID, ''}
    COGNITO_REGION: ${env:COGNITO_REGION, 'us-east-1'}
  
  iam:
    role:
      statements:
        # DynamoDB permissions (read-only for stream)
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:Scan
            - dynamodb:DescribeStream
            - dynamodb:GetRecords
            - dynamodb:GetShardIterator
            - dynamodb:ListStreams
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:custom.productsTable}
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:custom.productsTable}/stream/*
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:Query
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:custom.catalogProductsTable}
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:custom.priceListProductsTable}
        # Batch search jobs table (full CRUD)
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:custom.batchSearchJobsTable}
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:custom.batchSearchJobsTable}/index/*
        
        # AWS Bedrock permissions (for embeddings - NO Docker needed!)
        - Effect: Allow
          Action:
            - bedrock:InvokeModel
          Resource:
            - arn:aws:bedrock:*:*:foundation-model/amazon.titan-embed-text-v1
            - arn:aws:bedrock:*:*:foundation-model/cohere.embed-english-v3
        
        # Lambda invoke (for async job processing and parallel workers)
        - Effect: Allow
          Action:
            - lambda:InvokeFunction
          Resource:
            - arn:aws:lambda:${aws:region}:${aws:accountId}:function:${self:service}-${self:provider.stage}-searchApi
            - arn:aws:lambda:${aws:region}:${aws:accountId}:function:${self:service}-${self:provider.stage}-batchWorker
        
        # CloudWatch Logs
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: '*'
        
        # Secrets Manager access for API keys
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
            - secretsmanager:DescribeSecret
          Resource:
            - arn:aws:secretsmanager:${aws:region}:${aws:accountId}:secret:product-search-api-key-*
            - arn:aws:secretsmanager:${aws:region}:${aws:accountId}:secret:qdrant-api-key-*
            - arn:aws:secretsmanager:${aws:region}:${aws:accountId}:secret:file-ingestion-api-key-*
            - arn:aws:secretsmanager:${aws:region}:${aws:accountId}:secret:quotation-api-key-*

custom:
  uploadBucket: hb-files-raw
  filesTable: hb-files
  catalogProductsTable: hb-catalog-products
  productsTable: hb-products
  priceListProductsTable: hb-pricelist-products
  batchSearchJobsTable: hb-batch-search-jobs
  # Production frontend URL (change this when deploying to production)
  productionFrontendUrl: ${env:PRODUCTION_FRONTEND_URL, 'https://main.d1xymtccqgi62h.amplifyapp.com'}
  serverless-offline:
    httpPort: 3000
    lambdaPort: 3002
    useChildProcesses: true
    noPrependStageInUrl: true
  pythonRequirements:
    # Build deps into a Lambda layer (Linux wheels) and keep function zips small
    layer: true
    # Use the dedicated requirements file inside the layer directory
    fileName: layer/requirements.txt
    dockerizePip: false
    pipCmdExtraArgs:
      - "--platform"
      - "manylinux2014_x86_64"
      - "--only-binary"
      - ":all:"
      - "--implementation"
      - "cp"
      - "--python-version"
      - "3.11"
      - "--abi"
      - "cp311"
    slim: false
    strip: false
    zip: true
    invalidateCaches: true
    useDownloadCache: false
    useStaticCache: false
    # Use the explicit pyenv path so packaging always runs with Python 3.11
    pythonBin: "/Users/omerlewinsky/.pyenv/versions/3.11.9/bin/python3.11"
    noDeploy:
      - boto3
      - botocore
      - docutils
      - jmespath
      - pip
      - python-dateutil
      - s3transfer
      - setuptools
      - six
      - urllib3

functions:
  searchIndexer:
    handler: indexer/handler.handler
    description: Indexes products into Qdrant from DynamoDB Stream (using Bedrock embeddings)
    memorySize: 512
    timeout: 60
    layers:
      - { Ref: PythonRequirementsLambdaLayer }
    events:
      - stream:
          type: dynamodb
          arn:
            Fn::ImportValue: hb-file-processing-${self:provider.stage}-products-table-stream-arn
          batchSize: 10
          startingPosition: LATEST
          maximumRetryAttempts: 3
          enabled: true

  # Dedicated batch worker - invoked in parallel for fast processing
  batchWorker:
    handler: api/batch_worker.handler
    description: Parallel batch search worker - processes chunks of items
    memorySize: 1024  # More memory for faster processing
    timeout: 300  # 5 minutes per worker
    layers:
      - { Ref: PythonRequirementsLambdaLayer }
    # No HTTP events - invoked directly by searchApi

  searchApi:
    handler: api/handler.handler
    description: Search API for vector search and autocomplete (using Bedrock embeddings)
    memorySize: 1024  # Increased for faster cold starts (more memory = more CPU)
    timeout: 300  # 5 minutes for batch operations with many items
    layers:
      - { Ref: PythonRequirementsLambdaLayer }
    environment:
      BATCH_WORKER_FUNCTION: ${self:service}-${self:provider.stage}-batchWorker
    events:
      - httpApi:
          path: /search
          method: get
      - httpApi:
          path: /autocomplete
          method: get
      - httpApi:
          path: /product
          method: get
      - httpApi:
          path: /product/{orderingNumber}
          method: get
      - httpApi:
          path: /batch-search
          method: post
      # Batch search job management endpoints
      - httpApi:
          path: /batch-search/jobs
          method: get
      - httpApi:
          path: /batch-search/status/{jobId}
          method: get
      - httpApi:
          path: /batch-search/results/{jobId}
          method: get
      - httpApi:
          path: /batch-search/retry/{jobId}
          method: post
      - httpApi:
          path: /batch-search/cancel/{jobId}
          method: post
      - httpApi:
          path: /batch-search/resume/{jobId}
          method: post
      - httpApi:
          path: /batch-search/jobs/{jobId}
          method: delete
      - httpApi:
          path: /batch-search/jobs/{jobId}/selections
          method: put
      # Keep Lambda warm to avoid cold starts
      - schedule:
          rate: rate(5 minutes)
          enabled: true
          input:
            warmup: true
            source: "serverless-warmup"

plugins:
  - serverless-python-requirements
  - serverless-offline

package:
  individually: false
  patterns:
    - '!node_modules/**'
    - '!.venv/**'
    - '!__pycache__/**'
    - '!*.pyc'
    - '!.pytest_cache/**'
    - '!tests/**'
    - '!.serverless/**'
    - '!.git/**'
    - '!.env'
    - '!.env.*'
    - '!*.md'
    - '!scripts/**'
    - '!documentation/**'
    - 'indexer/**'
    - 'api/**'
    - 'schemas/**'
    - '../shared/**'
    - '../utils/**'

resources:
  Resources:
    # Batch Search Jobs Table for async job processing
    BatchSearchJobsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.batchSearchJobsTable}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: jobId
            AttributeType: S
          - AttributeName: userId
            AttributeType: S
        KeySchema:
          - AttributeName: jobId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: userId-index
            KeySchema:
              - AttributeName: userId
                KeyType: HASH
              - AttributeName: jobId
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
  
  Outputs:
    SearchApiUrl:
      Description: Search API URL
      Value:
        Fn::Sub: https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
      Export:
        Name: ${self:service}-${self:provider.stage}-api-url
    
    QdrantCollection:
      Description: Qdrant Collection Name
      Value: ${self:provider.environment.QDRANT_COLLECTION}
      Export:
        Name: ${self:service}-${self:provider.stage}-qdrant-collection
    
    BatchSearchJobsTableName:
      Description: Batch Search Jobs DynamoDB Table Name
      Value: ${self:custom.batchSearchJobsTable}
      Export:
        Name: ${self:service}-${self:provider.stage}-batch-search-jobs-table
